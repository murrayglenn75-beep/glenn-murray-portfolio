name: Evaluate dependency security upgrade

on:
  push:
    branches: [fix/evaluate-portfolio-dependency-upgrade]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assess-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        next-version: ["15.5.27", "latest"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Resolve framework candidate and lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact "next@${{ matrix.next-version }}" "eslint-config-next@${{ matrix.next-version }}"
          npm audit fix --package-lock-only --ignore-scripts || true

      - name: Install candidate
        run: npm ci

      - name: Audit production dependencies
        id: audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high --ignore-scripts

      - name: TypeScript
        id: types
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Candidate summary and strict acceptance
        if: always()
        env:
          AUDIT: ${{ steps.audit.outcome }}
          TYPES: ${{ steps.types.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          echo "Audit=$AUDIT Types=$TYPES Lint=$LINT Build=$BUILD"
          test "$AUDIT" = success
          test "$TYPES" = success
          test "$LINT" = success
          test "$BUILD" = success

      - name: Export candidate manifest and lockfile patch
        if: always()
        run: |
          git diff -- package.json package-lock.json > candidate-dependency-upgrade.patch
          git status --short

      - name: Upload candidate patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.next-version }}
          path: candidate-dependency-upgrade.patch
          if-no-files-found: error
